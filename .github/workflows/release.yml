name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # fail-fast: false — si un SO falla de verdad, que los otros dos
      # terminen igual y se puedan publicar (antes: uno fallaba y
      # cancelaba a los demás, dejando el release incompleto).
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows
            archive_ext: zip
          # "macos-latest" corre en Apple Silicon (ARM64) desde hace un
          # tiempo — un build hecho ahí NO abre en un Mac Intel (a
          # diferencia de Rosetta, que sí traduce Intel→ARM, no existe
          # traducción ARM→Intel). Usamos un runner Intel a propósito: el
          # .app que sale de acá corre nativo en Intel y, vía Rosetta 2
          # (que macOS instala solo con un click la primera vez), también
          # en Apple Silicon — un solo archivo sirve para cualquier Mac.
          # Gratis en repos públicos (no es un runner "-large"/de pago).
          # OJO: GitHub va rotando qué versión de macOS queda disponible
          # como Intel con el tiempo — si "macos-26-intel" deja de existir,
          # revisar https://github.com/actions/runner-images por el label
          # Intel vigente y actualizar acá.
          - os: macos-26-intel
            artifact_name: macos
            archive_ext: zip
          - os: ubuntu-latest
            artifact_name: linux
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Instalar dependencias de Python
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Fijar versión desde el tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > core/version.py

      - name: Empaquetar (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # pywebview en Windows depende de pythonnet (clr) para CUALQUIER
          # backend, incluido EdgeChromium/WebView2 — no es solo el WinForms
          # viejo (ver webview/platforms/edgechromium.py: hace `import clr`
          # igual). El hook que trae pythonnet para PyInstaller
          # (collect_dynamic_libs + collect_data_files) no siempre deja
          # Python.Runtime.deps.json y sus DLLs .NET compañeras (System.*.dll,
          # netstandard.dll) en la MISMA carpeta que Python.Runtime.dll — sin
          # ese .deps.json ahí al lado, clr_loader encuentra el .dll pero no
          # puede inicializar el runtime .NET, y truena con
          # "Failed to resolve Python.Runtime.Loader.Initialize". Se agrega
          # toda la carpeta pythonnet/runtime/ como un solo --add-data para
          # garantizar que quede completa y junta.
          $pynetRuntime = python -c "import pythonnet, os; print(os.path.join(os.path.dirname(pythonnet.__file__), 'runtime'))"
          python -m PyInstaller --name "Sistema de Gestion" --windowed --onedir `
            --collect-all openpyxl --collect-all pythonnet --collect-all clr_loader --collect-all webview `
            --add-data "recursos;recursos" `
            --add-data "$pynetRuntime;pythonnet/runtime" `
            --hidden-import "PIL._tkinter_finder" main.py

      - name: Empaquetar (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: >-
          python -m PyInstaller --name "Sistema de Gestion" --windowed --onedir
          --collect-all openpyxl --add-data "recursos:recursos"
          --hidden-import "PIL._tkinter_finder" main.py

      - name: Crear archivo (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path "dist/Sistema de Gestion" -DestinationPath "SistemaGestion-windows.zip"

      - name: Crear archivo (macOS)
        if: matrix.os == 'macos-26-intel'
        run: |
          cd dist
          zip -r -y "../SistemaGestion-macos.zip" "Sistema de Gestion.app"

      - name: Crear archivo (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czvf "../SistemaGestion-linux.tar.gz" "Sistema de Gestion"

      # Antes, cada job del matrix publicaba directo al Release en este
      # mismo paso — los 3 corriendo en paralelo chocaban entre sí contra
      # la API de GitHub (un solo Release, 3 escrituras concurrentes) y
      # alguno terminaba fallando con "Too many retries". Ahora cada job
      # solo deja su archivo como artefacto de build...
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SistemaGestion-${{ matrix.artifact_name }}
          path: SistemaGestion-${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  # ...y un único job, que corre una sola vez después de que terminan los
  # 3 builds, junta los artefactos y hace UNA sola publicación al Release
  # — sin carrera posible.
  publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Publicar en Release
        uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
