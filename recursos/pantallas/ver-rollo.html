<!DOCTYPE html>
<html lang="es" data-pantalla="ver-rollo" data-tema="inventario">
<head>
<meta charset="utf-8">
<title>Rollo · Sistema de Gestión</title>
<link rel="stylesheet" href="base.css">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Ver un rollo — abrir_rollo(id), botón ⓘ de la fila en el panel de
   Inventario (menu.html). Pantalla aparte (no un <dialog>) a propósito:
   un rollo puede acumular años de ajustes/consumos, y el diálogo de
   "Ajustar cantidad" ya recorta su lista a los últimos 2 (ver menu.html) —
   acá es donde se ve TODO, scrolleando (.contenido ya scrollea solo, ver
   base.css), con un timeline en vez de una tabla plana para que se lea
   como lo que es: la vida del rollo en el tiempo.
   ═══════════════════════════════════════════════════════════════════════════ */

.limite--rollo { width: min(100%, 46rem); margin-inline: auto; display: grid; gap: var(--e-5); }

.hoja {
  display: grid; gap: var(--e-4);
  padding: var(--e-5);
  background: var(--c-superficie);
  border: 1.5px solid var(--c-borde);
  border-radius: var(--r-xl);
  box-shadow: var(--s-2);
}
.hoja__cab { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--e-4); }
.hoja__cab-izq { display: grid; gap: var(--e-1); min-width: 0; }
.hoja__num {
  font-family: var(--f-mono); font-size: var(--t-3xl); font-weight: var(--peso-fuerte);
  line-height: 1; letter-spacing: -.03em; color: var(--c-tema-tinta);
}
.hoja__nombre { font-size: var(--t-lg); font-weight: var(--peso-medio); }

.datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: var(--e-3) var(--e-4); }
.dato { display: grid; gap: 1px; min-width: 0; align-content: start; }
.dato--ancho { grid-column: 1 / -1; }
.dato__et {
  font-size: var(--t-xs); font-weight: var(--peso-fuerte); letter-spacing: .08em;
  text-transform: uppercase; color: var(--c-texto-tenue);
}
.dato__val { font-size: var(--t-sm); overflow-wrap: anywhere; }
.dato__val--mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.stock { display: grid; gap: .25rem; }
.stock__texto { font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
.stock__barra {
  height: .3rem; border-radius: var(--r-full); overflow: hidden;
  background: color-mix(in srgb, var(--c-tema-borde) 30%, transparent);
}
.stock__barra > i { display: block; height: 100%; background: var(--c-tema-fuerte); }

/* ── Timeline del historial (usos) ────────────────────────────────────────
   Una línea vertical continua (::before de .timeline) atraviesa todos los
   puntos; cada punto se dibuja ENCIMA de esa línea (z-index), así queda
   una sola línea de punta a punta en vez de segmentos cortados entre
   tarjeta y tarjeta. */
.timeline { position: relative; }
.timeline::before {
  content: ""; position: absolute; left: .34rem; top: .3rem; bottom: .3rem;
  width: 2px; background: var(--c-borde);
}
.timeline__item { position: relative; padding-left: 1.85rem; }
.timeline__item + .timeline__item { margin-top: var(--e-4); }
.timeline__punto {
  position: absolute; left: 0; top: .3rem; z-index: 1;
  width: .9rem; height: .9rem; border-radius: 50%;
  background: var(--c-tema-fuerte);
  box-shadow: 0 0 0 3px var(--c-lienzo);
}
.timeline__punto--consumo { background: var(--c-op-fuerte); }

.timeline__card {
  background: var(--c-superficie);
  border: 1.5px solid var(--c-borde);
  border-radius: var(--r-lg);
  padding: var(--e-3) var(--e-4);
}
/* Mismo chip que la tabla de ajustes de menu.html (.chip-tipo) — vive acá
   también porque cada pantalla trae su propio CSS puntual, base.css solo
   tiene lo genérico compartido. */
.chip-tipo {
  display: inline-block; padding: 0 var(--e-2); border-radius: var(--r-full);
  font-size: var(--t-xs); font-weight: var(--peso-medio);
  background: var(--c-tema-relleno); color: var(--c-tema-fuerte);
}
.chip-tipo--consumo { background: var(--c-op-relleno); color: var(--c-op-fuerte); }
.timeline__cab { display: flex; align-items: center; gap: var(--e-2); flex-wrap: wrap; }
.timeline__fecha { font-size: var(--t-xs); color: var(--c-texto-tenue); margin-left: auto; white-space: nowrap; }
.timeline__cambio {
  font-family: var(--f-mono); font-variant-numeric: tabular-nums;
  font-weight: var(--peso-medio); font-size: var(--t-sm);
}
.timeline__descripcion { margin-top: var(--e-2); font-size: var(--t-sm); color: var(--c-texto-suave); }
.timeline__datos {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: var(--e-2) var(--e-4);
  margin-top: var(--e-3); padding-top: var(--e-3); border-top: 1px solid var(--c-borde);
}
.timeline__op {
  background: none; border: none; padding: 0; font: inherit;
  color: var(--c-tema-fuerte); font-family: var(--f-mono); font-weight: var(--peso-medio);
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.timeline__op:hover { color: var(--c-tema-tinta); }

.estado-vacio { padding: var(--e-6) 0; color: var(--c-texto-tenue); font-size: var(--t-sm); text-align: center; }
</style>
</head>

<body>
<div class="app">

  <header class="cabecera">
    <button class="cab-btn cab-btn--fantasma" data-accion="volver">← Volver</button>
    <span class="cabecera__titulo" data-titulo>Rollo</span>
    <span class="cabecera__sep"></span>
    <span class="cabecera__version" data-version></span>
  </header>

  <main class="contenido">
    <div class="cargando" data-cargando><span></span><span></span><span></span></div>

    <div class="limite--rollo" data-tras-carga hidden>

      <section class="hoja">
        <div class="hoja__cab">
          <div class="hoja__cab-izq">
            <span class="hoja__num" data-numero>—</span>
            <span class="hoja__nombre" data-nombre></span>
          </div>
          <span class="etiqueta" data-estado></span>
        </div>
        <div class="datos" data-datos></div>
      </section>

      <section>
        <h2 class="seccion-titulo">Historial</h2>
        <div class="timeline" data-timeline></div>
        <p class="estado-vacio" data-vacio hidden>Todavía no hay ningún ajuste o consumo registrado para este rollo.</p>
      </section>

    </div>
  </main>
</div>

<script src="api.js"></script>
<script src="app.js"></script>
<script>
(function () {
  "use strict";

  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s == null ? "" : s);

  const ETIQUETA_TIPO = { ajuste: "Ajuste", consumo: "Consumo" };

  function dato(et, val, mono, ancho) {
    if (!val && val !== 0) return null;
    const d = document.createElement("div");
    d.className = "dato" + (ancho ? " dato--ancho" : "");
    d.innerHTML = `<span class="dato__et"></span><span class="dato__val${mono ? " dato__val--mono" : ""}"></span>`;
    $(".dato__et", d).textContent = et;
    $(".dato__val", d).textContent = esc(val);
    return d;
  }

  function celdaStock(r) {
    const pct = r.metros_iniciales ? Math.round((r.metros_restantes / r.metros_iniciales) * 100) : 0;
    const d = document.createElement("div");
    d.className = "dato";
    d.innerHTML = `
      <span class="dato__et">Stock</span>
      <div class="stock">
        <span class="stock__texto">${esc(r.metros_restantes)} / ${esc(r.metros_iniciales)} m</span>
        <span class="stock__barra"><i style="width:${pct}%"></i></span>
      </div>`;
    return d;
  }

  function pintarCabecera(r) {
    const activo = (r.estado || "activo") === "activo";
    $("[data-numero]").textContent = `#${r.id}`;
    $("[data-nombre]").textContent = r.nombre_textil || "—";
    $("[data-titulo]").textContent = `Rollo #${r.id} · ${r.nombre_textil || ""}`;

    const chip = $("[data-estado]");
    chip.textContent = activo ? "Activo" : "Inactivo";
    chip.className = "etiqueta " + (activo ? "etiqueta--ok" : "etiqueta--neutra");

    const cont = $("[data-datos]");
    cont.textContent = "";
    [
      dato("Ancho", `${r.ancho} m`),
      dato("Proveedor", r.proveedor || "—"),
      dato("Fecha de ingreso", r.fecha, true),
      dato("Compra", r.precio_compra ? TD.fmt.pesos(r.precio_compra) : "—", true),
      dato("Valor por m", r.valor != null ? TD.fmt.pesos(r.valor) : "—", true),
      dato("Valor total", r.valor != null ? TD.fmt.pesos(r.valor * r.metros_iniciales) : "—", true),
      dato("Valor restante", r.valor != null ? TD.fmt.pesos(r.valor * r.metros_restantes) : "—", true),
    ].filter(Boolean).forEach((d) => cont.appendChild(d));
    cont.appendChild(celdaStock(r));
  }

  /* Cada tarjeta del timeline: común (punto de color + fecha + cambio de
     metros), y después lo propio de cada tipo — un ajuste solo trae una
     descripción libre; un consumo viene con el rastro completo hacia la OP
     que lo generó (cliente/tema/obs), grabado tal cual al momento del
     consumo (ver core.repositorio_inventario._agregar_registro) — no se
     recalcula acá ni depende de que esa OP siga existiendo en algún lado. */
  function tarjetaUso(u) {
    const esConsumo = u.tipo === "consumo";
    const item = document.createElement("div");
    item.className = "timeline__item";

    const datosConsumo = [
      ["Cliente", u.cliente],
      ["Tema", u.tema],
      ["Obs", u.obs],
    ].filter(([, val]) => val);

    item.innerHTML = `
      <div class="timeline__punto ${esConsumo ? "timeline__punto--consumo" : ""}"></div>
      <div class="timeline__card">
        <div class="timeline__cab">
          <span class="chip-tipo ${esConsumo ? "chip-tipo--consumo" : ""}"></span>
          <span class="timeline__cambio"></span>
          <span class="timeline__fecha"></span>
        </div>
        ${esConsumo ? "" : '<p class="timeline__descripcion"></p>'}
        ${esConsumo && (u.numero_op || datosConsumo.length) ? '<div class="timeline__datos"></div>' : ""}
      </div>`;

    $(".chip-tipo", item).textContent = ETIQUETA_TIPO[u.tipo] || u.tipo;
    $(".timeline__cambio", item).textContent =
      `${esc(u.metros_restantes_anterior)} → ${esc(u.metros_restantes_nuevo)} m`;
    $(".timeline__fecha", item).textContent = u.fecha || "";

    if (!esConsumo) {
      $(".timeline__descripcion", item).textContent = u.descripcion || "—";
    } else {
      const cont = $(".timeline__datos", item);
      if (cont) {
        if (u.numero_op) {
          const d = document.createElement("div");
          d.className = "dato";
          d.innerHTML = `<span class="dato__et">OP</span>`;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "timeline__op";
          btn.textContent = "#" + u.numero_op;
          btn.title = "Abrir esta OP";
          btn.addEventListener("click", () => TD.api.abrir_op(u.numero_op));
          d.appendChild(btn);
          cont.appendChild(d);
        }
        datosConsumo.forEach(([et, val]) => cont.appendChild(dato(et, val)));
      }
    }
    return item;
  }

  function pintarTimeline(r) {
    // Más reciente primero — mismo criterio que el resto de la app
    // (cotizaciones/OPs en el menú, la tabla de rollos).
    const usos = (r.usos || []).slice().reverse();
    const cont = $("[data-timeline]");
    cont.textContent = "";
    usos.forEach((u) => cont.appendChild(tarjetaUso(u)));
    $("[data-vacio]").hidden = usos.length > 0;
  }

  TD.iniciar(async (ctx) => {
    const r = (await TD.api.obtener_rollo(ctx.id)) || null;
    if (!r) { TD.aviso("No se pudo cargar el rollo.", "error", 8000); return; }
    pintarCabecera(r);
    pintarTimeline(r);
  });
})();
</script>

</body>
</html>
