<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OP N° {{numero}} · TEXDIGITAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#2563A8; --tinta:#1A2230; --gris:#5B6470; --linea:#D8DEE6;
    --fondo-suave:#F4F6F9;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Inter',system-ui,sans-serif; color:var(--tinta); background:#E9ECF1; }
  .hoja{ max-width:216mm; min-height:279mm; margin:24px auto; background:#fff;
    padding:18mm 16mm; box-shadow:0 2px 18px #0002; display:flex; flex-direction:column; }

  header{ display:flex; justify-content:space-between; align-items:flex-start;
    border-bottom:3px solid var(--azul); padding-bottom:6mm; }
  .marca-logo{ height:42px; width:auto; display:block; }
  .cot-box{ text-align:right; }
  .cot-box .titulo{ font-size:13px; letter-spacing:.14em; color:var(--gris); font-weight:600; }
  .cot-box .numero{ font-family:'Barlow Condensed'; font-size:34px; font-weight:700; color:var(--azul); line-height:1; }
  .cot-box .fechas{ font-size:12.5px; color:var(--gris); margin-top:3px; }
  .cot-box .fechas b{ color:var(--tinta); font-weight:600; }

  .datos{ display:flex; gap:8mm; margin:7mm 0 6mm; }
  .dato{ flex:1; background:var(--fondo-suave); border-radius:8px; padding:4mm 5mm; }
  .dato.entrega{ background:#FBF1E4; }
  .dato .k{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gris); font-weight:600; }
  .dato .v{ font-size:14px; font-weight:600; margin-top:1.5mm; }
  .dato .v2{ font-size:12.5px; color:var(--gris); margin-top:.6mm; }
  .dato.entrega .v{ color:#B4620C; font-size:18px; }

  .descripcion{ font-size:13px; color:var(--tinta); margin-bottom:6mm; }
  .descripcion b{ color:var(--gris); font-weight:600; text-transform:uppercase; font-size:10.5px; letter-spacing:.12em; display:block; margin-bottom:1.2mm; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th{ background:var(--tinta); color:#fff; text-align:left; padding:3mm 3.5mm;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; }
  thead th.num, td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  tbody td{ padding:3mm 3.5mm; border-bottom:1px solid var(--linea); vertical-align:top; }
  tbody tr:nth-child(even){ background:#FAFBFD; }
  tr.fila-totales td{ font-weight:700; background:var(--fondo-suave); border-top:2px solid var(--azul); }
  /* table-layout:fixed + anchos fijos en el <thead>: así un nombre de
     estructura/terminación largo se envuelve en varias líneas dentro de
     su propia columna (crece la fila, no rompe nada — tbody td ya tiene
     vertical-align:top) en vez de estirar la columna Producto y angostar
     las demás. */
  .tabla-productos{ table-layout:fixed; }
  .prod-nombre{ font-weight:600; }
  .prod-detalle{ font-size:11px; color:var(--gris); margin-top:1mm; }
  .prod-extras{ font-size:10.5px; color:var(--gris); margin-top:1.6mm; line-height:1.5; }
  .prod-extras b{ color:var(--tinta); font-weight:600; }
  .prod-nombre, .prod-detalle, .prod-extras{
    overflow-wrap:break-word; word-wrap:break-word; word-break:break-word;
  }

  .materiales{ margin-top:7mm; padding-top:6mm; border-top:1px solid var(--linea); }
  /* grid de 2 columnas fijas (no flexbox): así un bloque que queda solo
     en su fila (ej. Terminaciones, si Estructuras ya terminó más arriba)
     mantiene el mismo ancho de columna que el resto, en vez de estirarse
     a ocupar todo el ancho disponible. */
  .mat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 5mm; }
  .mat-bloque{ margin-bottom:5mm; }
  .mat-bloque h3{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--azul);
    font-weight:700; margin-bottom:2mm; }
  .mat-bloque table{ font-size:11.5px; }
  .mat-bloque td{ padding:1.6mm 2.5mm; border-bottom:1px solid var(--linea); }
  .mat-bloque td:last-child{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .mat-item{ font-size:11.5px; padding:1.6mm 2.5mm; border-bottom:1px solid var(--linea); }

  .btn-imprimir{ position:fixed; right:22px; bottom:22px; background:var(--azul); color:#fff;
    border:none; border-radius:10px; padding:12px 20px; font-family:'Inter'; font-size:14px;
    font-weight:600; cursor:pointer; box-shadow:0 4px 14px #0004; }
  .btn-imprimir:hover{ filter:brightness(1.08); }

  @media print{
    body{ background:#fff; }
    .hoja{ margin:0; box-shadow:none; max-width:none; min-height:auto; padding:12mm 14mm; }
    .btn-imprimir{ display:none; }
  }
  @page{ size:letter; margin:0; }
</style>
</head>
